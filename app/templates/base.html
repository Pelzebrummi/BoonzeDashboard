<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Boonze Dashboard{% endblock %}</title>
  <script>
    // Follow Home Assistant's own dark mode, also when it is switched later. The
    // ingress panel is a same-origin iframe; outside Home Assistant the system
    // setting applies (CSS media query).
    (function () {
      function apply() {
        try {
          var ha = window.parent !== window ? window.parent.document.querySelector("home-assistant") : null;
          var themes = ha && ha.hass ? ha.hass.themes : null;
          if (themes && typeof themes.darkMode === "boolean") {
            document.documentElement.dataset.theme = themes.darkMode ? "dark" : "light";
          }
        } catch (error) {}
      }
      apply();
      try {
        // Home Assistant restyles its root element when the theme changes.
        if (window.parent !== window) {
          new MutationObserver(apply).observe(window.parent.document.documentElement, { attributes: true });
        }
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ base }}/static/boonze.css?v={{ asset_version }}">
</head>
<body>
  <nav class="bz-nav" aria-label="Bereiche">
    <a href="{{ base }}/"{% if nav == "overview" %} aria-current="{{ nav_current }}"{% endif %}>Übersicht</a>
    <a href="{{ base }}/upload"{% if nav == "upload" %} aria-current="{{ nav_current }}"{% endif %}>PDF hochladen</a>
    <a href="{{ base }}/entries/new"{% if nav == "entry" %} aria-current="{{ nav_current }}"{% endif %}>Eintrag erfassen</a>
    <a href="{{ base }}/settings"{% if nav == "settings" %} aria-current="{{ nav_current }}"{% endif %}>HA-Statistiken</a>
    {% if user %}<span class="bz-nav__user">{{ user }}</span>{% endif %}
  </nav>
  <main class="bz-page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
